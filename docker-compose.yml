services:
  pantrypal:
    build:
      context: .
    container_name: pantrypal
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: "file:/data/pantrypal.db"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      ENABLE_EXTERNAL_IMAGE_ANALYSIS: "${ENABLE_EXTERNAL_IMAGE_ANALYSIS:-false}"
      IMAGE_ANALYSIS_PROVIDER: "${IMAGE_ANALYSIS_PROVIDER:-mock}"
      # OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # WEB_PUSH_PUBLIC_KEY: "${WEB_PUSH_PUBLIC_KEY:-}"
      # WEB_PUSH_PRIVATE_KEY: "${WEB_PUSH_PRIVATE_KEY:-}"
      # WEB_PUSH_SUBJECT: "${WEB_PUSH_SUBJECT:-mailto:you@example.com}"
      # Set true only when you want the sample data loaded into an empty/local demo DB.
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
    volumes:
      - pantrypal_data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pantrypal_data:
